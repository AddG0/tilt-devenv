[workspace]
resolver = "3"
members = ["crates/repos-core", "crates/repos", "crates/repos-tiltd"]

# crane reads the derivation name from here (the workspace root has no [package]).
[workspace.metadata.crane]
name = "repos"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Shared dependency versions (clap 4, clap_complete unstable-dynamic,
# owo-colors 4, thiserror 2, serde 1).
[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
humantime = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "process"] }
notify = "8"
comfy-table = { version = "7", features = ["custom_styling"] }
owo-colors = { version = "4", features = ["supports-colors"] }
futures = "0.3"
assert_cmd = "2"
predicates = "3"
repos-core = { path = "crates/repos-core" }

[profile.release]
strip = true
